name: CI

# 工具链版本固定：pnpm 11.28.4（与根 package.json 的 packageManager 一致）、Bun 1.4.4、Node 24。
# 版本漂移会直接改变测试结果（Bun 1.4.4 曾暴露测试 mock 跨文件污染），因此不在 workflow 里用 latest。
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: 校验类型、构建与格式化
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests (plugin)
        run: pnpm --filter @devcxl/opencode-memory test

      - name: Run format check
        run: pnpm format:check

      - name: Build plugin
        run: pnpm --filter @devcxl/opencode-memory build

      - name: Check npm package contents
        working-directory: apps/plugin
        run: npm pack --dry-run --ignore-scripts
