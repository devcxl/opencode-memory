name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: 校验类型、构建与格式化
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests (plugin)
        run: pnpm --filter @devcxl/opencode-memory test

      - name: Run format check
        run: pnpm format:check

      - name: Build plugin
        run: pnpm --filter @devcxl/opencode-memory build

      - name: Build web
        run: pnpm --filter @devcxl/opencode-memory-web build

      - name: Check npm package contents
        working-directory: apps/plugin
        run: npm pack --dry-run --ignore-scripts
