name: PR Review Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: 自动代码审查 (Pi Agent)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PR Overview on Runner
        id: prep
        run: |
          mkdir -p /tmp/pr-diff
          BASE_REF="origin/${{ github.base_ref || 'main' }}"
          git fetch origin ${{ github.base_ref || 'main' }} --depth=1 || true

          # 1. 生成整体变更统计（过滤掉自动生成的大文件）
          git --no-pager diff "$BASE_REF..HEAD" --stat \
            -- . ':!pnpm-lock.yaml' ':!*.lock.yml' ':!dist' \
            > /tmp/pr-diff/stat.txt

          # 2. 生成提交历史清单
          git --no-pager log "$BASE_REF..HEAD" --oneline > /tmp/pr-diff/commits.txt

          echo "Extracted PR overview: stat lines=$(wc -l < /tmp/pr-diff/stat.txt), commits=$(wc -l < /tmp/pr-diff/commits.txt)"

      - name: Run Pi Code Review
        id: pi_review
        uses: devcxl/agentic-action@main
        with:
          provider: 'half-cabbage'
          model: 'deepseek-v4-flash'
          thinking: 'high'
          tools: 'read,grep,find,ls'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          context_files: '/tmp/pr-diff/stat.txt /tmp/pr-diff/commits.txt'
          prompt: |
            请基于提供的变更统计（@/tmp/pr-diff/stat.txt）和提交历史（@/tmp/pr-diff/commits.txt），结合本地已检出的完整代码库进行深度代码审查。

            审查要求：
            1. 请使用 read 工具针对核心代码改动（如 apps/api/src/auth/、apps/api/src/services/、apps/api/src/search/hybrid.ts、apps/plugin/src/）按需查阅其实际源码实现。
            2. 重点排查：
               - 业务逻辑正确性与边界处理（空值、异常分支、生命周期）
               - 安全性（越权访问、鉴权绕过、SQL/FTS注入、敏感配置泄露、CORS凭据安全）
               - 并发与性能（异步竞态、超时、死循环重试风险）
               - 架构规范与类型契约完整性
            3. 输出专业、有条理的 Markdown 格式审查报告，必须包含：
               - 总体结论（可合并 / 需修改 / 阻断性风险）
               - 核心架构与重构亮点说明
               - 问题清单（按严重程度 Critical / High / Medium 分级，指明具体文件、代码行与整改方案）
        env:
          HALF_CABBAGE_BASE_URL: ${{ secrets.HALF_CABBAGE_BASE_URL }}
          HALF_CABBAGE_API_KEY: ${{ secrets.HALF_CABBAGE_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}

      - name: Post Review Comment to PR
        if: always() && steps.pi_review.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          if [ -n "$PR_NUM" ] && [ -s "$GITHUB_STEP_SUMMARY" ]; then
            gh pr comment "$PR_NUM" --body-file "$GITHUB_STEP_SUMMARY"
            echo "Successfully posted review comment to PR #$PR_NUM"
          else
            echo "Skipping PR comment (PR number missing or step summary empty)."
          fi
