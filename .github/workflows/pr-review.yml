name: PR Review Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: 自动代码审查 (Pi Agent)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Pi Code Review
        id: pi_review
        uses: devcxl/agentic-action@main
        with:
          provider: 'half-cabbage'
          model: 'deepseek-v4-flash'
          thinking: 'max'
          tools: 'read,bash,grep,find,ls,web_search'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            请对 PR #${{ github.event.pull_request.number }} 的代码变更执行深度代码审查。

            执行要求与策略：
            1. 先运行 `git --no-pager diff --stat origin/${{ github.base_ref }}...HEAD` 获取变更文件总览；
            2. 忽略 pnpm-lock.yaml、构建产物等自动生成文件，聚焦核心逻辑变更（如 apps/api, apps/plugin, apps/pi-extension, packages/shared）；
            3. 排查要点：
               - 业务逻辑正确性与边界（空值、异常分支）
               - 安全性（越权访问、鉴权绕过、注入、敏感配置泄露）
               - 检索与性能（排序稳定性、超时、资源泄露）
               - 单测覆盖有效性
            4. 生成结构清晰的 Markdown 评审报告（结论、问题清单分级及具体位置与改进建议）；
            5. 使用 `gh pr comment ${{ github.event.pull_request.number }} --body "<审查报告>"` 发布评论。
        env:
          HALF_CABBAGE_BASE_URL: ${{ secrets.HALF_CABBAGE_BASE_URL }}
          HALF_CABBAGE_API_KEY: ${{ secrets.HALF_CABBAGE_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
