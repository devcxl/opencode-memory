name: PR Review Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: 自动代码审查 (Pi Agent)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PR Overview & Core Diff on Runner
        id: prep
        run: |
          mkdir -p /tmp/pr-diff
          BASE_REF="origin/${{ github.base_ref || 'main' }}"
          git fetch origin ${{ github.base_ref || 'main' }} --depth=1 || true

          # 1. 生成整体变更统计（过滤掉自动生成的大文件）
          git --no-pager diff "$BASE_REF..HEAD" --stat \
            -- . ':!pnpm-lock.yaml' ':!*.lock.yml' ':!dist' \
            > /tmp/pr-diff/stat.txt

          # 2. 生成提交历史清单
          git --no-pager log "$BASE_REF..HEAD" --oneline > /tmp/pr-diff/commits.txt

          # 3. 提取核心模块的新增与修改 Diff 摘录（限制在 1200 行以内，过滤纯删除与 lockfile）
          git --no-pager diff "$BASE_REF..HEAD" --diff-filter=d \
            -- apps/api/src apps/plugin/src apps/pi-extension/src packages/shared/src scripts/migrate-v2.ts \
            ':!*.lock.yml' ':!pnpm-lock.yaml' \
            | head -n 1200 \
            > /tmp/pr-diff/core-diff.patch

          echo "Extracted PR info: stat lines=$(wc -l < /tmp/pr-diff/stat.txt), commits=$(wc -l < /tmp/pr-diff/commits.txt), diff lines=$(wc -l < /tmp/pr-diff/core-diff.patch)"

      - name: Run Pi Code Review
        id: pi_review
        uses: devcxl/agentic-action@main
        with:
          provider: 'half-cabbage'
          model: 'deepseek-v4-flash'
          thinking: 'high'
          tools: 'read,grep,find,ls'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          context_files: '/tmp/pr-diff/stat.txt /tmp/pr-diff/commits.txt /tmp/pr-diff/core-diff.patch'
          prompt: |
            请基于提供的变更统计（@/tmp/pr-diff/stat.txt）、提交历史（@/tmp/pr-diff/commits.txt）以及核心代码变动（@/tmp/pr-diff/core-diff.patch），直接输出专业、全面且深度的 Markdown 代码审查报告。

            审查指引与要点：
            1. 核心代码变动与架构概览已在上述上下文中完整提供，请直接进行综合研判，如无绝对必要无需额外调用工具，一次性输出完整的审查报告。
            2. 重点审查维度：
               - 业务逻辑正确性与边界处理（数据模型统一、空值、异常分支、生命周期）
               - 安全性（越权访问、鉴权绕过、SQL/FTS注入、敏感配置泄露、CORS凭据安全）
               - 检索与性能（两桶分层混合检索稳定性、分面过滤、Cron 定时任务幂等与死循环防范）
               - 架构与类型契约（Shared 领域模型、OpenCode 插件薄客户端、Pi 扩展、MCP 协议一致性）
               - 单测覆盖有效性与回归风险
            3. 输出报告必须包含：
               - 总体结论与风险评级（推荐合并 / 建议优化 / 存在风险）
               - 架构重构亮点说明
               - 分级问题清单（按 Critical / High / Medium 分级，指明具体文件、代码行与整改方案）
               - 合并前核查与后续建议
        env:
          HALF_CABBAGE_BASE_URL: ${{ secrets.HALF_CABBAGE_BASE_URL }}
          HALF_CABBAGE_API_KEY: ${{ secrets.HALF_CABBAGE_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}

      - name: Post Review Comment to PR
        if: always() && steps.pi_review.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          if [ -n "$PR_NUM" ] && [ -s "$GITHUB_STEP_SUMMARY" ]; then
            gh pr comment "$PR_NUM" --body-file "$GITHUB_STEP_SUMMARY"
            echo "Successfully posted review comment to PR #$PR_NUM"
          else
            echo "Skipping PR comment (PR number missing or step summary empty)."
          fi
