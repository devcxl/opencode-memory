name: Publish V1 legacy

# 一次性/低频的 V1 维护发布：V1 树的布局是根 package.json + src，不走 V2 的
# apps/plugin 流水线。只允许 v1.x tag，手动触发；发布到 npm 的 latest。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: V1 tag to publish (must match package.json version)
        required: true
        default: v1.2.1
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish V1 to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V1 tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate V1 tag and version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v1.*) ;;
            *) echo "::error::Only v1.x tags may use this workflow (got $TAG)"; exit 1 ;;
          esac

          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi

          if [ ! -f bun.lock ] || [ ! -f src/index.ts ]; then
            echo "::error::This is not a V1 repository layout (missing bun.lock or src/index.ts)"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Check package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Publish 1.x to latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --ignore-scripts --access public --tag latest

      - name: Verify npm dist-tags
        env:
          PKG: "@devcxl/opencode-memory"
          VERSION: ${{ inputs.tag }}
        run: |
          VERSION="${VERSION#v}"
          npm view "$PKG" dist-tags --json > "$RUNNER_TEMP/dist-tags.json"
          node -e '
            const fs = require("node:fs");
            const tags = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/dist-tags.json", "utf8"));
            if (tags.latest !== process.env.VERSION) {
              console.error(`::error::latest=${tags.latest}, expected ${process.env.VERSION}`);
              process.exit(1);
            }
            if (tags.v2 && !/^2\./.test(tags.v2)) {
              console.error(`::error::v2=${tags.v2} is not a 2.x version`);
              process.exit(1);
            }
            console.log("dist-tags:", JSON.stringify(tags));
          '

      - name: Summary
        run: |
          {
            echo "## V1 publish completed"
            echo ""
            echo "- Tag: \`${{ inputs.tag }}\`"
            echo "- npm tag: \`latest\`"
            echo "- Package: \`@devcxl/opencode-memory\`"
          } >> "$GITHUB_STEP_SUMMARY"
