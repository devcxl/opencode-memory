name: Release

# 触发：人工 workflow_dispatch，校验通过后创建并推送 v<version> tag。
# 后续由 `Draft Release` workflow 创建 draft release；人工发布后由 `Publish to npm` 发布。
#
# 基底分支规则：2.x 只允许 main；1.x 的 docs-only 补丁从 v1 维护分支手动发布，
# 不经过本 workflow（v1 树缺少 apps/plugin/package.json，会在 layout guard 处失败）。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要发布的分支、tag 或 commit SHA
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  create-tag:
    name: 校验并创建发布 tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # 发布策略（dist-tag、允许的基底分支）取自默认分支：
      # v1 维护树的布局与 V2 不同，不能假设目标 ref 里有这些脚本。
      - name: Checkout release tooling (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .release-tooling
          sparse-checkout: apps/plugin/src/release
          fetch-depth: 1

      - name: Detect release tree layout
        run: |
          if [ ! -f apps/plugin/package.json ]; then
            echo "::error::目标 ref 不是 V2 仓库布局（缺少 apps/plugin/package.json）。1.x 维护发布请按 v1 分支的手动发布流程执行，不经过本 workflow。"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read package version and dist-tag
        id: package
        run: |
          VERSION=$(bun -e "console.log(JSON.parse(require('node:fs').readFileSync('apps/plugin/package.json', 'utf8')).version)")
          # dist-tag 规则只有一处实现：apps/plugin/src/release/distTag.ts
          # 通过 .release-tooling 执行默认分支上的最新规则，不在 workflow 里重复判断版本
          DIST_TAG=$(bun .release-tooling/apps/plugin/src/release/distTagCli.ts "$VERSION")

          TAG="v${VERSION}"
          PRERELEASE=false
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE=true
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests (plugin)
        run: pnpm --filter @devcxl/opencode-memory test

      - name: Run format check
        run: pnpm format:check

      - name: Build plugin
        run: pnpm --filter @devcxl/opencode-memory build

      - name: Check npm package contents
        working-directory: apps/plugin
        run: npm pack --dry-run --ignore-scripts

      - name: Ensure tag does not already exist
        env:
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::本地 checkout 中已经存在 tag $TAG"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::远端已经存在 tag $TAG"
            exit 1
          fi

      # 1.x 的 docs-only 补丁（1.2.1）从 v1 维护分支手动发布，不经过本 workflow：
      # v1 树缺少 apps/plugin/package.json，会在 layout guard 处明确失败。
      - name: Ensure target ref is reachable from default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          TARGET_SHA=$(git rev-parse HEAD)

          if ! git merge-base --is-ancestor "$TARGET_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::目标 ref 不在 origin/$DEFAULT_BRANCH 提交链上，拒绝创建发布 tag"
            exit 1
          fi

      - name: Create tag
        env:
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          git tag "$TAG"
          echo "已创建 tag $TAG，对应 apps/plugin/package.json version=$VERSION"

      - name: Push tag to origin
        env:
          TAG: ${{ steps.package.outputs.tag }}
        run: git push origin "$TAG"

      # GITHUB_TOKEN 推送 tag 不会触发其它 workflow（包括 Draft Release），
      # 因此由本 workflow 直接创建 draft release，避免发布链断掉。
      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: Release ${{ steps.package.outputs.tag }}
          draft: true
          prerelease: ${{ steps.package.outputs.prerelease == 'true' }}
          generate_release_notes: true

      - name: Write summary
        env:
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
          DIST_TAG: ${{ steps.package.outputs.dist_tag }}
          PRERELEASE: ${{ steps.package.outputs.prerelease }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          {
            echo "## Release tag created"
            echo ""
            echo "- Ref: \`${RELEASE_REF}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- Tag: \`${TAG}\`"
            echo "- npm dist-tag: \`${DIST_TAG}\`"
            echo "- Prerelease: \`${PRERELEASE}\`"
            echo ""
            echo "已推送 tag 并创建 draft release。人工发布 draft 后将触发 npm publish。"
          } >> "$GITHUB_STEP_SUMMARY"
