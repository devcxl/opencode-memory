name: Release V1

# V1 维护线（v1 分支）的独立 tag 创建流水线。
# 只允许从 v1 分支创建 v1.x tag；V2 的 release 流水线在 main 分支，互不干扰。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要发布的 V1 分支、tag 或 commit SHA
        required: true
        default: v1
        type: string

permissions:
  contents: write

jobs:
  create-tag:
    name: 校验并创建 V1 发布 tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Validate V1 layout
        run: |
          if [ ! -f bun.lock ] || [ ! -f src/index.ts ]; then
            echo "::error::目标 ref 不是 V1 仓库布局（缺少 bun.lock 或 src/index.ts）"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Run format check
        run: bun run format:check

      - name: Build package
        run: bun run build

      - name: Check npm package contents
        run: bun pm pack --dry-run --ignore-scripts

      - name: Read package version
        id: package
        run: |
          VERSION=$(bun -e "console.log(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version)")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Ensure tag does not already exist
        env:
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::本地 checkout 中已经存在 tag $TAG"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::远端已经存在 tag $TAG"
            exit 1
          fi

      - name: Ensure target ref is on v1 branch
        run: |
          git fetch origin v1
          TARGET_SHA=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$TARGET_SHA" "origin/v1"; then
            echo "::error::目标 ref 不在 origin/v1 提交链上，拒绝创建 V1 发布 tag"
            exit 1
          fi

      - name: Create tag
        env:
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          git tag "$TAG"
          echo "已创建 tag $TAG，对应 package.json version=$VERSION"

      - name: Push tag to origin
        env:
          TAG: ${{ steps.package.outputs.tag }}
        run: git push origin "$TAG"

      - name: Write summary
        env:
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          {
            echo "## V1 release tag created"
            echo ""
            echo "- Ref: \`${RELEASE_REF}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- Tag: \`${TAG}\`"
            echo ""
            echo "已推送 tag。V1 publish workflow 可手动触发 \`tag=${TAG}\` 发布到 npm latest。"
          } >> "$GITHUB_STEP_SUMMARY"
