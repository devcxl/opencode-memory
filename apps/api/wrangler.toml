name = "cloudflare-memory"
compatibility_date = "2025-01-01"
main = "src/index.ts"

[assets]
directory = "../../apps/web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "memory-db"
database_id = "eeaf425c-fdfe-4b60-a96f-f3ebbd58a632"

[[vectorize]]
binding = "VEC"
index_name = "memory-index"

[triggers]
crons = ["0 4 * * *"]

[observability]
enabled = true

[vars]
ALLOWED_ORIGINS = "http://localhost:3000,http://127.0.0.1:3000"
RATE_LIMIT = "100"

# Staging 环境配置（wrangler deploy --env staging）
[env.staging]
name = "cloudflare-memory-staging"

[env.staging.ai]
binding = "AI"

[env.staging.observability]
enabled = true

[env.staging.vars]
ALLOWED_ORIGINS = "*"
RATE_LIMIT = "100"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "memory-db"
database_id = "eeaf425c-fdfe-4b60-a96f-f3ebbd58a632"

[[env.staging.vectorize]]
binding = "VEC"
index_name = "memory-index"

[env.staging.triggers]
crons = ["0 4 * * *"]
